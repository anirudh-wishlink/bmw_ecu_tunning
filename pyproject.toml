[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-f10-diag"
version = "0.1.0"
description = "Read-only BMW F10 ENET diagnostic framework for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
f10diag = "f10diag.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f10diag = ["definitions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
